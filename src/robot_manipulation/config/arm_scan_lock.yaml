arm_scan_lock_action_server:
  ros__parameters:
    action_name: /arm_scan_lock
    model_feedback_topic: /arm_position_fb
    hardware_trajectory_topic: /plan_controller/joint_trajectory
    publish_rate: 10.0
    trajectory_duration: 0.2

    # Units are radians. Fill these with the RViz/TF pose you want to expose
    # while converting point cloud to 2D laser.
    model_joint_positions:
      - 0.0
      - -0.4155
      - 0.9526
      - 1.4134
      - 0.0

    # Units are radians. Fill these with the physical arm command that makes
    # the real camera align with the model/RViz pose above.
    hardware_joint_positions:
      - 0.5
      - -0.4155
      - 0.9526
      - 1.4134
      - 0.0
