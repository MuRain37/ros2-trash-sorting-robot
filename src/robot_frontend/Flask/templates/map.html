{% extends "base.html" %}

{% block title %}导航 - 机器人控制系统{% endblock %}

{% block page_title %}导航{% endblock %}
{% block page_subtitle %}按下并拖拽地图设置路径点位置和方向，最后一个点为最终目标。{% endblock %}

{% block content %}
<section class="card map-card">
    <div class="card-header map-toolbar">
        <span><i class="fas fa-route me-2"></i>导航地图</span>
        <div class="tool-row">
            <span class="status-pill warn" id="map-mode-label">等待地图</span>
            <button class="btn btn-sm btn-primary" type="button" onclick="handleTargetButton()" id="target-mode-btn">
                <i class="fas fa-location-dot me-1"></i><span id="target-mode-text">设定目标点</span>
            </button>
            <button class="btn btn-sm btn-outline-warning" type="button" onclick="setDumpBucketPoseMode(1)" id="dump-bucket-1-btn">
                <i class="fas fa-dumpster me-1"></i>设定卸载桶1位置
            </button>
            <button class="btn btn-sm btn-outline-warning" type="button" onclick="setDumpBucketPoseMode(2)" id="dump-bucket-2-btn">
                <i class="fas fa-dumpster-fire me-1"></i>设定卸载桶2位置
            </button>
            <button class="btn btn-sm btn-outline-primary" type="button" onclick="setMode('region')" id="region-mode-btn">
                <i class="fas fa-vector-square me-1"></i>框选区域
            </button>
            <select class="form-select form-select-sm region-select" id="region-select" onchange="selectRegionFromDropdown()"></select>
            <button class="btn btn-sm btn-success" type="button" onclick="cleanSelectedRegion()">
                <i class="fas fa-broom me-1"></i>清扫区域
            </button>
            <button class="btn btn-sm btn-danger" type="button" onclick="deleteSelectedRegion()">
                <i class="fas fa-trash me-1"></i>删除区域
            </button>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="map-stage" id="map-stage">
            <canvas id="map-canvas"></canvas>
            <div class="region-strip" id="region-strip"></div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
    .map-card {
        min-height: 720px;
    }

    .map-toolbar {
        flex-wrap: wrap;
    }

    .tool-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
    }

    .region-select {
        width: 168px;
        min-height: 32px;
        font-weight: 700;
    }

    .map-stage {
        position: relative;
        height: 666px;
        overflow: hidden;
        background: #101615;
    }

    #map-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
    }

    .region-strip {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        pointer-events: none;
    }

    .region-chip {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 0 10px;
        color: #1f2328;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #d7dde5;
        border-radius: 8px;
        font-weight: 800;
        cursor: pointer;
    }

    .region-chip.selected {
        border-color: #2f80ed;
        box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.18);
    }

    .region-swatch {
        width: 10px;
        height: 22px;
        border-radius: 4px;
    }

    @media (max-width: 720px) {
        .map-stage {
            height: 520px;
        }

        .tool-row {
            justify-content: flex-start;
        }
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    let mapData = {{ map_data|tojson }};
    let regions = {{ regions|tojson }};
    let dumpBucketPoses = {{ dump_bucket_poses|tojson }};
    let selectedRegionId = regions[0]?.region_id || null;
    let mode = 'target';
    let dumpPoseBucketId = null;
    let dumpPoseDragStart = null;
    let dumpPoseDragCurrent = null;
    let pathEditing = false;
    let stagedWaypoints = [];
    let waypointDragStart = null;
    let waypointDragCurrent = null;
    let isDragging = false;
    let dragStart = null;
    let dragCurrent = null;
    let currentImageVersion = null;
    const mapImage = new Image();

    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('map-stage');

    mapImage.onload = () => drawMap();

    function mapMeta() {
        return mapData && mapData.has_map ? mapData.map : null;
    }

    function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * ratio);
        canvas.height = Math.floor(rect.height * ratio);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        drawMap();
    }

    function viewport() {
        const rect = canvas.getBoundingClientRect();
        const meta = mapMeta();
        if (!meta) {
            return { x: 0, y: 0, width: rect.width, height: rect.height };
        }
        const mapAspect = meta.width / meta.height;
        const canvasAspect = rect.width / rect.height;
        if (canvasAspect > mapAspect) {
            const height = rect.height;
            const width = height * mapAspect;
            return { x: (rect.width - width) / 2, y: 0, width, height };
        }
        const width = rect.width;
        const height = width / mapAspect;
        return { x: 0, y: (rect.height - height) / 2, width, height };
    }

    function worldToCanvas(point) {
        const meta = mapMeta();
        if (!meta || !point) return null;
        const view = viewport();
        const widthM = meta.width * meta.resolution;
        const heightM = meta.height * meta.resolution;
        return {
            x: view.x + ((point.x - meta.origin.x) / widthM) * view.width,
            y: view.y + (1 - ((point.y - meta.origin.y) / heightM)) * view.height
        };
    }

    function canvasToWorld(point) {
        const meta = mapMeta();
        if (!meta) return null;
        const view = viewport();
        if (
            point.x < view.x || point.x > view.x + view.width ||
            point.y < view.y || point.y > view.y + view.height
        ) {
            return null;
        }
        const widthM = meta.width * meta.resolution;
        const heightM = meta.height * meta.resolution;
        return {
            x: meta.origin.x + ((point.x - view.x) / view.width) * widthM,
            y: meta.origin.y + (1 - ((point.y - view.y) / view.height)) * heightM,
            theta: 0
        };
    }

    function eventPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }

    function drawMap() {
        const rect = canvas.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#101615';
        ctx.fillRect(0, 0, width, height);

        const view = viewport();
        if (mapImage.complete && mapImage.naturalWidth) {
            ctx.drawImage(mapImage, view.x, view.y, view.width, view.height);
        }

        drawGrid(view);
        regions.forEach(drawRegion);
        drawDumpBucketMarkers();
        drawStagedPath();
        drawWaypointDraft();
        drawDumpPoseDraft();
        drawTargetPath();
        drawRobot();
        drawDraftRect();
    }

    function drawGrid(view) {
        ctx.save();
        ctx.strokeStyle = 'rgba(47, 128, 237, 0.16)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 10; i++) {
            const x = view.x + (view.width / 10) * i;
            ctx.beginPath();
            ctx.moveTo(x, view.y);
            ctx.lineTo(x, view.y + view.height);
            ctx.stroke();
        }
        for (let i = 0; i <= 10; i++) {
            const y = view.y + (view.height / 10) * i;
            ctx.beginPath();
            ctx.moveTo(view.x, y);
            ctx.lineTo(view.x + view.width, y);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawRegion(region) {
        if (!region.vertices || region.vertices.length < 4) return;
        const points = region.vertices.map(worldToCanvas).filter(Boolean);
        if (points.length < 4) return;
        const selected = region.region_id === selectedRegionId;
        ctx.save();
        ctx.fillStyle = `${region.color || '#2f80ed'}33`;
        ctx.strokeStyle = region.color || '#2f80ed';
        ctx.lineWidth = selected ? 4 : 2;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        const center = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 });
        center.x /= points.length;
        center.y /= points.length;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#101615';
        ctx.lineWidth = 4;
        ctx.font = '800 15px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.strokeText(region.region_name, center.x, center.y);
        ctx.fillText(region.region_name, center.x, center.y);
        ctx.restore();
    }

    function drawTargetPath() {
        if (!mapData.target_point || pathEditing || stagedWaypoints.length) return;
        const target = worldToCanvas(mapData.target_point);
        const robot = worldToCanvas(mapData.robot_position);
        if (!target) return;
        ctx.save();
        if (robot) {
            ctx.strokeStyle = '#f5a524';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(robot.x, robot.y);
            ctx.lineTo(target.x, target.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        ctx.fillStyle = '#f5a524';
        ctx.strokeStyle = '#101615';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(target.x, target.y, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawDirectionArrow(point, length = 28, color = '#101615') {
        const endX = point.x + Math.cos(point.theta || 0) * length;
        const endY = point.y - Math.sin(point.theta || 0) * length;
        const head = 8;
        const headAngle = Math.atan2(point.y - endY, endX - point.x);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(point.x, point.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
            endX - head * Math.cos(headAngle - Math.PI / 6),
            endY + head * Math.sin(headAngle - Math.PI / 6)
        );
        ctx.lineTo(
            endX - head * Math.cos(headAngle + Math.PI / 6),
            endY + head * Math.sin(headAngle + Math.PI / 6)
        );
        ctx.closePath();
        ctx.fill();
    }

    function drawStagedPath() {
        if (!stagedWaypoints.length) return;
        const points = stagedWaypoints.map(worldToCanvas).filter(Boolean);
        if (!points.length) return;
        ctx.save();
        ctx.strokeStyle = '#f5a524';
        ctx.lineWidth = 3;
        if (points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            points.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
            ctx.stroke();
        }
        points.forEach((point, index) => {
            const waypoint = stagedWaypoints[index];
            const isGoal = index === points.length - 1;
            const radius = isGoal ? 13 : 9;
            ctx.fillStyle = isGoal ? '#f5a524' : '#2f80ed';
            ctx.strokeStyle = '#101615';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawDirectionArrow({ ...point, theta: waypoint.theta }, isGoal ? 34 : 28);
            ctx.fillStyle = '#101615';
            ctx.font = isGoal ? '800 10px Microsoft YaHei' : '800 12px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isGoal ? '目标' : String(index + 1), point.x, point.y);
        });
        ctx.restore();
    }

    function drawWaypointDraft() {
        if (!waypointDragStart || !waypointDragCurrent) return;
        const startWorld = canvasToWorld(waypointDragStart);
        const currentWorld = canvasToWorld(waypointDragCurrent);
        if (!startWorld || !currentWorld) return;
        const theta = Math.atan2(currentWorld.y - startWorld.y, currentWorld.x - startWorld.x);
        ctx.save();
        ctx.fillStyle = '#f5a524';
        ctx.strokeStyle = '#101615';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(waypointDragStart.x, waypointDragStart.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        drawDirectionArrow({ ...waypointDragStart, theta }, 38);
        ctx.restore();
    }

    function drawDumpBucketMarkers() {
        Object.entries(dumpBucketPoses || {}).forEach(([key, pose]) => {
            const point = worldToCanvas(pose);
            if (!point) return;
            const bucketId = Number(pose.bucket_id || key);
            ctx.save();
            ctx.fillStyle = bucketId === 1 ? '#f59e0b' : '#ef4444';
            ctx.strokeStyle = '#101615';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(point.x, point.y, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawDirectionArrow({ ...point, theta: pose.theta || pose.yaw || 0 }, 36, '#101615');
            ctx.fillStyle = '#101615';
            ctx.font = '800 11px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`桶${bucketId}`, point.x, point.y);
            ctx.restore();
        });
    }

    function drawDumpPoseDraft() {
        if (!dumpPoseDragStart || !dumpPoseDragCurrent || !dumpPoseBucketId) return;
        const startWorld = canvasToWorld(dumpPoseDragStart);
        const currentWorld = canvasToWorld(dumpPoseDragCurrent);
        if (!startWorld || !currentWorld) return;
        const theta = Math.atan2(currentWorld.y - startWorld.y, currentWorld.x - startWorld.x);
        ctx.save();
        ctx.fillStyle = dumpPoseBucketId === 1 ? '#f59e0b' : '#ef4444';
        ctx.strokeStyle = '#101615';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(dumpPoseDragStart.x, dumpPoseDragStart.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        drawDirectionArrow({ ...dumpPoseDragStart, theta }, 40);
        ctx.fillStyle = '#101615';
        ctx.font = '800 11px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`桶${dumpPoseBucketId}`, dumpPoseDragStart.x, dumpPoseDragStart.y);
        ctx.restore();
    }

    function drawRobot() {
        const pose = mapData.robot_position;
        const pos = worldToCanvas(pose);
        if (!pose || !pos) return;
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(-(pose.theta || 0));
        ctx.fillStyle = '#2f80ed';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-13, 11);
        ctx.lineTo(-13, -11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawDraftRect() {
        if (!dragStart || !dragCurrent) return;
        ctx.save();
        ctx.fillStyle = 'rgba(47, 128, 237, 0.18)';
        ctx.strokeStyle = '#2f80ed';
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 5]);
        const x = Math.min(dragStart.x, dragCurrent.x);
        const y = Math.min(dragStart.y, dragCurrent.y);
        const w = Math.abs(dragStart.x - dragCurrent.x);
        const h = Math.abs(dragStart.y - dragCurrent.y);
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
    }

    function setMode(nextMode) {
        mode = nextMode;
        dragStart = null;
        dragCurrent = null;
        dumpPoseBucketId = null;
        dumpPoseDragStart = null;
        dumpPoseDragCurrent = null;
        if (mode !== 'target') {
            pathEditing = false;
            stagedWaypoints = [];
            waypointDragStart = null;
            waypointDragCurrent = null;
        }
        document.getElementById('target-mode-btn').className =
            pathEditing ? 'btn btn-sm btn-warning' : (mode === 'target' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary');
        document.getElementById('region-mode-btn').className =
            mode === 'region' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary';
        updateDumpBucketButtons();
        updateTargetButton();
        updateModeLabel();
        drawMap();
    }

    async function handleTargetButton() {
        if (!pathEditing) {
            mode = 'target';
            pathEditing = true;
            stagedWaypoints = [];
            waypointDragStart = null;
            waypointDragCurrent = null;
            updateTargetButton();
            updateModeLabel();
            drawMap();
            showToast('按下并拖拽地图设置路径点方向，最后一个为目标点', 'info');
            return;
        }
        await submitStagedPath();
    }

    function setDumpBucketPoseMode(bucketId) {
        mode = 'dump_pose';
        pathEditing = false;
        stagedWaypoints = [];
        waypointDragStart = null;
        waypointDragCurrent = null;
        dragStart = null;
        dragCurrent = null;
        dumpPoseBucketId = bucketId;
        dumpPoseDragStart = null;
        dumpPoseDragCurrent = null;
        updateDumpBucketButtons();
        updateTargetButton();
        updateModeLabel();
        drawMap();
        showToast(`按下并拖拽地图设定卸载桶${bucketId}位置和朝向`, 'info');
    }

    function resetWaypointDraft() {
        waypointDragStart = null;
        waypointDragCurrent = null;
    }

    function resetDumpPoseDraft() {
        dumpPoseDragStart = null;
        dumpPoseDragCurrent = null;
    }

    function addDraggedWaypoint() {
        const startWorld = canvasToWorld(waypointDragStart);
        const currentWorld = canvasToWorld(waypointDragCurrent);
        if (!startWorld || !currentWorld) {
            showToast('请在地图有效区域内拖拽设置方向', 'warning');
            resetWaypointDraft();
            drawMap();
            return;
        }
        const dx = waypointDragCurrent.x - waypointDragStart.x;
        const dy = waypointDragCurrent.y - waypointDragStart.y;
        if (Math.hypot(dx, dy) < 8) {
            showToast('请拖拽一小段距离来设置目标方向', 'warning');
            resetWaypointDraft();
            drawMap();
            return;
        }
        startWorld.theta = Math.atan2(currentWorld.y - startWorld.y, currentWorld.x - startWorld.x);
        stagedWaypoints.push(startWorld);
        mapData.target_point = startWorld;
        resetWaypointDraft();
        updateTargetButton();
        updateModeLabel();
        drawMap();
    }

    function updateTargetButton() {
        const button = document.getElementById('target-mode-btn');
        const text = document.getElementById('target-mode-text');
        if (!button || !text) return;
        if (pathEditing) {
            button.className = 'btn btn-sm btn-warning';
            text.textContent = '导航至目标点';
        } else {
            button.className = mode === 'target' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary';
            text.textContent = '设定目标点';
        }
    }

    function updateDumpBucketButtons() {
        [1, 2].forEach(bucketId => {
            const button = document.getElementById(`dump-bucket-${bucketId}-btn`);
            if (!button) return;
            button.className = mode === 'dump_pose' && dumpPoseBucketId === bucketId
                ? 'btn btn-sm btn-warning'
                : 'btn btn-sm btn-outline-warning';
        });
    }

    function updateModeLabel() {
        const label = document.getElementById('map-mode-label');
        if (!mapData.has_map) {
            label.textContent = '等待地图';
            label.className = 'status-pill warn';
            return;
        }
        if (mode === 'region') {
            label.textContent = '拖拽框选区域';
        } else if (mode === 'dump_pose' && dumpPoseBucketId) {
            label.textContent = `拖拽设定卸载桶${dumpPoseBucketId}位置和方向`;
        } else if (pathEditing) {
            if (stagedWaypoints.length) {
                const viaCount = Math.max(0, stagedWaypoints.length - 1);
                label.textContent = viaCount
                    ? `${viaCount} 个途经点，1 个最终目标点；继续拖拽可追加`
                    : '已设置最终目标点；继续拖拽可追加途经点';
            } else {
                label.textContent = '按下并拖拽地图设置路径点方向';
            }
        } else {
            label.textContent = '按按钮后设置路径';
        }
        label.className = 'status-pill ok';
    }

    function updateMapImage() {
        const meta = mapMeta();
        const version = meta ? meta.image_version : `empty-${Date.now()}`;
        if (version === currentImageVersion && mapImage.complete) return;
        currentImageVersion = version;
        mapImage.src = `/api/map/image?v=${encodeURIComponent(version)}`;
    }

    async function submitStagedPath() {
        if (!stagedWaypoints.length) {
            showToast('请先拖拽设置至少一个目标点', 'warning');
            return;
        }
        const response = await fetch('/api/map/path', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ waypoints: stagedWaypoints })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || '路径导航提交失败');
        }
        mapData.target_point = data.target_point;
        mapData.nav_status = data.nav_status;
        stagedWaypoints = [];
        pathEditing = false;
        resetWaypointDraft();
        updateTargetButton();
        updateModeLabel();
        drawMap();
        showToast(data.message || '导航路径已发送', 'success');
    }

    async function submitDumpBucketPose() {
        const startWorld = canvasToWorld(dumpPoseDragStart);
        const currentWorld = canvasToWorld(dumpPoseDragCurrent);
        if (!startWorld || !currentWorld) {
            showToast('请在地图有效区域内拖拽设置桶位方向', 'warning');
            resetDumpPoseDraft();
            drawMap();
            return;
        }
        const dx = dumpPoseDragCurrent.x - dumpPoseDragStart.x;
        const dy = dumpPoseDragCurrent.y - dumpPoseDragStart.y;
        if (Math.hypot(dx, dy) < 8) {
            showToast('请拖拽一小段距离来设置卸载桶朝向', 'warning');
            resetDumpPoseDraft();
            drawMap();
            return;
        }

        startWorld.theta = Math.atan2(currentWorld.y - startWorld.y, currentWorld.x - startWorld.x);
        startWorld.yaw = startWorld.theta;
        startWorld.bucket_id = dumpPoseBucketId;
        startWorld.frame_id = 'map';

        const response = await fetch('/api/map/dump_bucket_pose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(startWorld)
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || data.message || '卸载桶位置保存失败');
        }
        dumpBucketPoses = data.poses || dumpBucketPoses;
        mode = 'target';
        dumpPoseBucketId = null;
        resetDumpPoseDraft();
        updateDumpBucketButtons();
        updateTargetButton();
        updateModeLabel();
        drawMap();
        showToast(data.message || '卸载桶位置已保存', 'success');
    }

    async function createRegionFromDrag() {
        const topLeftCanvas = {
            x: Math.min(dragStart.x, dragCurrent.x),
            y: Math.min(dragStart.y, dragCurrent.y)
        };
        const bottomRightCanvas = {
            x: Math.max(dragStart.x, dragCurrent.x),
            y: Math.max(dragStart.y, dragCurrent.y)
        };
        if (bottomRightCanvas.x - topLeftCanvas.x < 20 || bottomRightCanvas.y - topLeftCanvas.y < 20) {
            showToast('区域太小，请重新框选', 'warning');
            return;
        }

        const topLeft = canvasToWorld(topLeftCanvas);
        const topRight = canvasToWorld({ x: bottomRightCanvas.x, y: topLeftCanvas.y });
        const bottomRight = canvasToWorld(bottomRightCanvas);
        const bottomLeft = canvasToWorld({ x: topLeftCanvas.x, y: bottomRightCanvas.y });
        if (!topLeft || !topRight || !bottomRight || !bottomLeft) {
            showToast('请在地图有效区域内框选', 'warning');
            return;
        }

        const xs = [topLeft.x, topRight.x, bottomRight.x, bottomLeft.x];
        const ys = [topLeft.y, topRight.y, bottomRight.y, bottomLeft.y];
        const nextId = Math.max(0, ...regions.map(region => region.region_id)) + 1;
        const palette = ['#2f80ed', '#22a06b', '#f5a524', '#d92d20', '#8b5cf6'];
        const region = {
            region_id: nextId,
            name: `区域 ${nextId}`,
            vertices: [topLeft, topRight, bottomRight, bottomLeft],
            bounds: {
                min_x: Math.min(...xs),
                min_y: Math.min(...ys),
                max_x: Math.max(...xs),
                max_y: Math.max(...ys)
            },
            frame_id: 'map',
            color: palette[(nextId - 1) % palette.length]
        };

        const response = await fetch('/api/map/regions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(region)
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || '区域保存失败');
        }
        regions.push(data.region);
        selectedRegionId = data.region.region_id;
        setMode('target');
        renderRegionStrip();
        renderRegionSelect();
        drawMap();
        showToast('区域已框选', 'success');
    }

    async function cleanSelectedRegion() {
        if (!selectedRegionId) {
            showToast('请先框选或选择区域', 'warning');
            return;
        }
        const response = await fetch('/api/map/clean_region', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ region_id: selectedRegionId })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            showToast(data.error || '区域清扫提交失败', 'error');
            return;
        }
        showToast(data.message || `区域 ${selectedRegionId} 已提交清扫`, 'success');
    }

    async function deleteSelectedRegion() {
        if (!selectedRegionId) {
            showToast('请先选择区域', 'warning');
            return;
        }
        const response = await fetch(`/api/map/regions?region_id=${selectedRegionId}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok || !data.success) {
            showToast(data.error || '删除区域失败', 'error');
            return;
        }
        regions = regions.filter(region => region.region_id !== selectedRegionId);
        selectedRegionId = regions[0]?.region_id || null;
        renderRegionStrip();
        renderRegionSelect();
        drawMap();
        showToast('区域已删除', 'success');
    }

    function selectRegion(regionId) {
        selectedRegionId = regionId;
        renderRegionStrip();
        renderRegionSelect();
        drawMap();
    }

    function selectRegionFromDropdown() {
        const value = document.getElementById('region-select').value;
        selectedRegionId = value ? Number(value) : null;
        renderRegionStrip();
        drawMap();
    }

    function renderRegionStrip() {
        const strip = document.getElementById('region-strip');
        strip.innerHTML = regions.map(region => `
            <button class="region-chip ${region.region_id === selectedRegionId ? 'selected' : ''}" type="button" onclick="selectRegion(${region.region_id})">
                <span class="region-swatch" style="background:${region.color}"></span>
                ${region.region_name}
            </button>
        `).join('');
    }

    function renderRegionSelect() {
        const select = document.getElementById('region-select');
        if (!regions.length) {
            select.innerHTML = '<option value="">暂无区域</option>';
            select.value = '';
            return;
        }
        select.innerHTML = regions.map(region => `
            <option value="${region.region_id}">${region.region_name}</option>
        `).join('');
        if (!regions.some(region => region.region_id === selectedRegionId)) {
            selectedRegionId = regions[0].region_id;
        }
        select.value = String(selectedRegionId);
    }

    async function refreshMapData(showMessage = false) {
        try {
            const response = await fetch('/api/map/data');
            mapData = await response.json();
            if (mapData.dump_bucket_poses) {
                dumpBucketPoses = mapData.dump_bucket_poses;
            }
            updateModeLabel();
            updateMapImage();
            drawMap();
            if (showMessage) {
                showToast(mapData.has_map ? '地图已刷新' : '尚未收到地图', mapData.has_map ? 'success' : 'warning');
            }
        } catch (error) {
            showToast('地图刷新失败', 'error');
        }
    }

    canvas.addEventListener('mousedown', event => {
        if (mode === 'dump_pose' && dumpPoseBucketId) {
            dumpPoseDragStart = eventPoint(event);
            dumpPoseDragCurrent = dumpPoseDragStart;
            drawMap();
            return;
        }
        if (mode === 'target' && pathEditing) {
            waypointDragStart = eventPoint(event);
            waypointDragCurrent = waypointDragStart;
            drawMap();
            return;
        }
        if (mode !== 'region') return;
        isDragging = true;
        dragStart = eventPoint(event);
        dragCurrent = dragStart;
        drawMap();
    });

    canvas.addEventListener('mousemove', event => {
        if (mode === 'dump_pose' && dumpPoseBucketId && dumpPoseDragStart) {
            dumpPoseDragCurrent = eventPoint(event);
            drawMap();
            return;
        }
        if (mode === 'target' && pathEditing && waypointDragStart) {
            waypointDragCurrent = eventPoint(event);
            drawMap();
            return;
        }
        if (!isDragging || mode !== 'region') return;
        dragCurrent = eventPoint(event);
        drawMap();
    });

    canvas.addEventListener('mouseup', async event => {
        if (mode === 'dump_pose' && dumpPoseBucketId && dumpPoseDragStart) {
            dumpPoseDragCurrent = eventPoint(event);
            try {
                await submitDumpBucketPose();
            } catch (error) {
                showToast(error.message || '卸载桶位置保存失败', 'error');
                resetDumpPoseDraft();
                drawMap();
            }
            return;
        }
        if (mode === 'target' && pathEditing && waypointDragStart) {
            waypointDragCurrent = eventPoint(event);
            addDraggedWaypoint();
            return;
        }
        if (mode !== 'region') return;
        isDragging = false;
        dragCurrent = eventPoint(event);
        try {
            await createRegionFromDrag();
        } catch (error) {
            showToast(error.message || '区域创建失败', 'error');
        } finally {
            dragStart = null;
            dragCurrent = null;
            drawMap();
        }
    });

    window.addEventListener('resize', resizeCanvas);
    renderRegionStrip();
    renderRegionSelect();
    resizeCanvas();
    updateModeLabel();
    updateTargetButton();
    updateDumpBucketButtons();
    updateMapImage();
    setInterval(refreshMapData, 1500);
</script>
{% endblock %}
